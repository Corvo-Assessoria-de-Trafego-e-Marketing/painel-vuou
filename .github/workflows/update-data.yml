name: Atualizar dados Vuou (Meta + Google)

# AGENDAMENTO (26/11/2026): uma rodada curta por hora, pelo agendamento normal do GitHub.
# Antes cada execução ficava ~6 h ligada (loop de 55 min) e disparava a próxima sozinha. O GitHub
# desativou o painel da Contourline em 24/11 por termos de uso, e esse uso contínuo do Actions é a
# causa mais provável. Não voltar ao loop nem ao auto-disparo: o agendamento pode atrasar, e tudo bem.

on:
  schedule:
    - cron: "17 * * * *"      # de hora em hora (o GitHub pode atrasar ou pular rodadas)
  workflow_dispatch:          # rodar à mão: Actions > este workflow > Run workflow

# B5 (passo 11): nada por padrão; o job abaixo pede só o necessário.
permissions: {}

concurrency:
  group: update-data
  cancel-in-progress: false   # uma rodada por vez; a seguinte espera

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20         # uma rodada leva poucos minutos
    permissions:
      contents: write           # commit do data.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"   # Node 20 saiu de suporte em 30/04/2026

      - name: Atualizar os dados (uma rodada)
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
          SINCE: ${{ vars.SINCE }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_DEVELOPER_TOKEN }}
          GOOGLE_CUSTOMER_ID: ${{ vars.GOOGLE_CUSTOMER_ID }}
          GOOGLE_LOGIN_CUSTOMER_ID: ${{ vars.GOOGLE_LOGIN_CUSTOMER_ID }}
          GOOGLE_SINCE: ${{ vars.GOOGLE_SINCE }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # variável vazia vira "use o padrão do script"
          [ -z "$GOOGLE_CUSTOMER_ID" ] && unset GOOGLE_CUSTOMER_ID
          [ -z "$GOOGLE_LOGIN_CUSTOMER_ID" ] && unset GOOGLE_LOGIN_CUSTOMER_ID
          echo "Rodada $(date -u '+%Y-%m-%d %H:%M UTC')"
          git fetch -q origin main
          git reset -q --hard origin/main        # parte do que está publicado (sem conflito)
          node scripts/fetch-meta.mjs || echo "AVISO: Meta falhou nesta rodada (segue)"
          if [ -n "$GOOGLE_REFRESH_TOKEN" ]; then
            node scripts/fetch-google.mjs || echo "AVISO: Google falhou nesta rodada (segue)"
          else
            echo "Secrets do Google Ads não configurados — pulando."
          fi
          git add data.json thumbs 2>/dev/null || git add data.json
          [ -f data-google.json ] && git add data-google.json
          if [ -n "$(git status --porcelain -- data.json data-google.json thumbs)" ]; then
            git commit -q -m "chore: atualiza dados Vuou ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push -q || echo "AVISO: push falhou (a próxima rodada recomeça do publicado)"
          else
            echo "Sem mudança nos dados."
          fi
