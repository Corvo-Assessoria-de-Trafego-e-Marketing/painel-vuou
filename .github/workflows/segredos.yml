# Checagem de segredos no GitHub: rede de seguranca para quem fez commit sem o hook
# local (.githooks). Roda o gitleaks com as regras da Corvo (.gitleaks.toml) em todo
# o historico e falha se achar senha, token ou chave. Os valores saem mascarados.
name: Checagem de segredos

on:
  push:
    paths-ignore: ['data.json', 'data-google.json', 'thumbs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar o gitleaks 8.30.1 (versao e checksum fixos)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks

      - name: Procurar segredos
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml --verbose .
